name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-pm
        run: |
          if [ -f "bun.lockb" ]; then
            echo "manager=bun" >> $GITHUB_OUTPUT
            echo "install=bun install --frozen-lockfile" >> $GITHUB_OUTPUT
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "install=pnpm install --frozen-lockfile" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "install=yarn install --frozen-lockfile" >> $GITHUB_OUTPUT
          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "install=npm ci" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "install=npm install" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.detect-pm.outputs.manager }}

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: ${{ steps.detect-pm.outputs.install }}

      - name: Run tests
        if: hashFiles('package.json') != ''
        run: |
          if npm run --silent test -- --help > /dev/null 2>&1; then
            npm test
          else
            echo "No test script found, skipping"
          fi

      - name: Run linter
        if: hashFiles('package.json') != ''
        run: |
          if [ -d "src" ]; then
            npx eslint src/
          elif npm run --silent lint -- --help > /dev/null 2>&1; then
            npm run lint
          else
            echo "No lint target found, skipping"
          fi

      - name: Type check
        if: hashFiles('tsconfig.json') != ''
        run: npx tsc --noEmit
